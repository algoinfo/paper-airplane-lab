<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Paper airplane in flight</title>
  <desc id="desc">Illustration of a folded paper airplane against a soft sky gradient</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fc"/>
      <stop offset="55%" stop-color="#f6f1e8"/>
      <stop offset="100%" stop-color="#dceefb"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e7e2d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1a2b3c" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <ellipse cx="420" cy="520" rx="280" ry="42" fill="#1a2b3c" opacity="0.06"/>
  <g filter="url(#shadow)" transform="translate(520 180) rotate(-8)">
    <path fill="url(#plane)" stroke="#c9bfb0" stroke-width="3"
      d="M0 120 L420 20 L180 120 L320 200 L0 120 Z"/>
    <path fill="#f8f6f2" stroke="#c9bfb0" stroke-width="2"
      d="M180 120 L320 200 L300 128 L180 120 Z"/>
    <path fill="none" stroke="#d8cfc2" stroke-width="2"
      d="M0 120 L420 20"/>
  </g>
  <text x="80" y="96" font-family="Georgia, serif" font-size="42" fill="#1a2b3c" font-weight="600">Paper Airplane Lab</text>
  <text x="80" y="142" font-family="system-ui, sans-serif" font-size="26" fill="#5c6b7a">Fold. Fly. Experiment.</text>
</svg>